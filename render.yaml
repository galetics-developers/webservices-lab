services:
  - type: web
    name: wslab-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_EXTRA_ORIGINS
        sync: false
      - key: HTTP_TIMEOUT_MS
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: wslab-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_MAX_CONNECTIONS
        value: "5"
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: COUNTRY_INFO_WSDL_URL
        value: http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso?WSDL
      - key: COUNTRY_INFO_ENDPOINT
        value: http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso
      - key: EXTERNAL_RSS_URL
        value: https://feeds.bbci.co.uk/mundo/rss.xml

databases:
  - name: wslab-postgres
    plan: free
    databaseName: wslab
    user: wslab_app
    ipAllowList: []
